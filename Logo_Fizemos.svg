<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3CB67"/>
      <stop offset="40%" stop-color="#DFB053"/>
      <stop offset="100%" stop-color="#BE9640"/>
    </linearGradient>
    <linearGradient id="roofBlue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0A3A7A"/>
      <stop offset="100%" stop-color="#021946"/>
    </linearGradient>
  </defs>
  
  <!-- Outer dark navy circle -->
  <circle cx="250" cy="250" r="242" fill="none" stroke="#021946" stroke-width="16"/>
  
  <!-- Gold accent circle -->
  <circle cx="250" cy="250" r="228" fill="none" stroke="url(#goldGrad)" stroke-width="9"/>
  
  <!-- White fill -->
  <circle cx="250" cy="250" r="222" fill="#FFFFFF"/>
  
  <!-- Main logo group - centered -->
  <g transform="translate(250, 235)">
    
    <!-- ========== HOUSE / ROOF ========== -->
    <!-- Chimney -->
    <g fill="#021946">
      <rect x="-148" y="-105" width="28" height="55" rx="1"/>
      <rect x="-153" y="-112" width="38" height="10" rx="2"/>
    </g>
    
    <!-- Roof base shape (house top) -->
    <path d="M-155 -50 
             L-95 -118 
             L5 -118 
             L75 -50 
             L75 -28 
             L-155 -28 Z" 
          fill="#021946"/>
    
    <!-- Roof diagonal stripes for corrugated look -->
    <g stroke="#1A4A9A" stroke-width="7" stroke-linecap="butt" fill="none">
      <line x1="-140" y1="-45" x2="-100" y2="-110"/>
      <line x1="-115" y1="-40" x2="-75" y2="-110"/>
      <line x1="-90" y1="-35" x2="-50" y2="-110"/>
      <line x1="-65" y1="-32" x2="-25" y2="-110"/>
      <line x1="-40" y1="-32" x2="0" y2="-110"/>
      <line x1="-15" y1="-32" x2="25" y2="-110"/>
      <line x1="10" y1="-35" x2="50" y2="-105"/>
      <line x1="35" y1="-40" x2="70" y2="-90"/>
    </g>
    
    <!-- Lighter highlight stripes -->
    <g stroke="#2A5AAA" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.7">
      <line x1="-135" y1="-50" x2="-95" y2="-112"/>
      <line x1="-110" y1="-45" x2="-70" y2="-112"/>
      <line x1="-85" y1="-40" x2="-45" y2="-112"/>
      <line x1="-60" y1="-37" x2="-20" y2="-112"/>
      <line x1="-35" y1="-37" x2="5" y2="-112"/>
      <line x1="-10" y1="-37" x2="30" y2="-110"/>
      <line x1="15" y1="-40" x2="55" y2="-100"/>
      <line x1="40" y1="-45" x2="68" y2="-85"/>
    </g>
    
    <!-- Bottom bar under roof (connects to text) -->
    <rect x="-155" y="-28" width="230" height="10" fill="#021946"/>
    
    <!-- ========== TEXT FIZEMO$ ========== -->
    <text x="-148" y="18" 
          font-family="'Arial Black', 'Helvetica Black', Arial, sans-serif" 
          font-size="46" 
          font-weight="900" 
          fill="#021946" 
          letter-spacing="-1.5">
      FIZEMO
    </text>
    
    <!-- Dollar sign - slightly gold accent to match original style -->
    <text x="58" y="18" 
          font-family="'Arial Black', 'Helvetica Black', Arial, sans-serif" 
          font-size="46" 
          font-weight="900" 
          fill="#021946">
      $
    </text>
    
    <!-- Small underline under the text -->
    <rect x="-150" y="26" width="225" height="5" rx="1" fill="#021946"/>
    
    <!-- ========== CORRETORA ========== -->
    <text x="-5" y="68" 
          font-family="'Arial Black', 'Helvetica Black', Arial, sans-serif" 
          font-size="30" 
          font-weight="900" 
          fill="#021946" 
          text-anchor="middle"
          letter-spacing="1.5">
      CORRETORA
    </text>
    
    <!-- ========== TREE ========== -->
    <g transform="translate(100, -75)">
      <!-- Trunk -->
      <path d="M -2,50 
               C -1,30 2,15 3,0 
               C 4,-12 2,-25 0,-35" 
            stroke="#5D4037" 
            stroke-width="7" 
            fill="none" 
            stroke-linecap="round"/>
      <path d="M 2,50 
               C 4,25 7,10 9,-5" 
            stroke="#6D4C41" 
            stroke-width="4" 
            fill="none" 
            stroke-linecap="round"/>
      
      <!-- Foliage - layered ellipses for depth -->
      <!-- Back leaves (darker) -->
      <ellipse cx="-12" cy="-20" rx="22" ry="20" fill="#1B5E20"/>
      <ellipse cx="18" cy="-15" rx="20" ry="18" fill="#1B5E20"/>
      <ellipse cx="5" cy="-45" rx="18" ry="16" fill="#2E7D32"/>
      
      <!-- Middle layer -->
      <ellipse cx="0" cy="-25" rx="26" ry="22" fill="#2E7D32"/>
      <ellipse cx="-18" cy="-5" rx="16" ry="15" fill="#388E3C"/>
      <ellipse cx="20" cy="-5" rx="15" ry="14" fill="#388E3C"/>
      <ellipse cx="8" cy="-40" rx="14" ry="13" fill="#43A047"/>
      
      <!-- Front leaves (lighter) -->
      <ellipse cx="-5" cy="-35" rx="12" ry="11" fill="#4CAF50"/>
      <ellipse cx="12" cy="-28" rx="11" ry="10" fill="#66BB6A"/>
      <ellipse cx="-15" cy="-28" rx="10" ry="9" fill="#4CAF50"/>
      <ellipse cx="22" cy="-22" rx="9" ry="8" fill="#81C784"/>
      
      <!-- Pointy leaf details -->
      <ellipse cx="-22" cy="-12" rx="7" ry="11" fill="#388E3C" transform="rotate(-35 -22 -12)"/>
      <ellipse cx="25" cy="-12" rx="6" ry="10" fill="#43A047" transform="rotate(40 25 -12)"/>
      <ellipse cx="0" cy="-52" rx="6" ry="9" fill="#66BB6A" transform="rotate(-5 0 -52)"/>
      <ellipse cx="15" cy="-48" rx="5" ry="8" fill="#4CAF50" transform="rotate(20 15 -48)"/>
      <ellipse cx="-10" cy="-48" rx="5" ry="8" fill="#43A047" transform="rotate(-25 -10 -48)"/>
    </g>
    
  </g>
</svg>
